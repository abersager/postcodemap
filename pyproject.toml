[project]
name = "postcodemap-pipeline"
version = "0.1.0"
description = "Data pipeline for the UK postcode map: derives postcode polygons from open unit centroids and tiles them."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0.4",
    "pyproj>=3.6",
]

[tool.uv]
package = false
