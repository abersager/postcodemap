# GitHub Pages now only redirects to https://postcodemap.net (the app and its
# data are deployed to Cloudflare by cloudflare.yml). Runs on dispatch and on
# changes to the redirect page.
name: Deploy redirect to GitHub Pages
on:
  workflow_dispatch:
  push:
    paths: ["redirect/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: redirect }
      - id: deployment
        uses: actions/deploy-pages@v4
