<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GB postcode map</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="map"></div>

  <form id="search" autocomplete="off">
    <input id="q" type="search" placeholder="Search a postcode: SW1A 2AA, EH12, 1010, 80" spellcheck="false" />
    <button type="submit" aria-label="Search">Go</button>
    <ul id="suggestions" hidden></ul>
    <div id="msg" hidden></div>
  </form>

  <div id="legend">
    <div class="title"><span id="country"></span> <span id="zoom"></span></div>
    <div id="rows"></div>
    <div id="density"></div>
    <div id="hover"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
